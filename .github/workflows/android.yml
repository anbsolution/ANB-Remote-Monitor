name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build both debug APKs
        run: gradle --no-daemon :host:assembleDebug :viewer:assembleDebug

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ANB-Remote-Monitor-Debug-APKs
          path: |
            host/build/outputs/apk/debug/*.apk
            viewer/build/outputs/apk/debug/*.apk
          if-no-files-found: error
